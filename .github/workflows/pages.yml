name: Publish site

'on':
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]
  push:
  workflow_dispatch:

permissions: {}
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  labels:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create missing publishing labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels="published:0e8a16 type:blog:1d76db type:idea:d876e3 type:about:5319e7"
          have() { gh label list --limit 1000 --json name --jq '.[].name' | grep -qixF "$1"; }
          for spec in $labels; do
            name=${spec%:*}
            have "$name" || gh label create "$name" --color "${spec##*:}" || have "$name"
          done
          echo "Publishing labels are ready. Give an Issue one type:* label and published." >> "$GITHUB_STEP_SUMMARY"

  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: read
    outputs:
      skipped-issues: ${{ steps.content.outputs.skipped-issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails here when Settings → Pages → Source is not "GitHub Actions".
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Export the Issues as Markdown
        id: content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          uvx escaping-site@0.6.0 export --config config.yaml --output content || status=$?
          # 2: exported, but some Issues were skipped; the last step reports them.
          if [ "$status" -eq 2 ]; then exit 0; fi
          exit "$status"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the site
        env:
          # Used when config.yaml has no site.url.
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Report skipped Issues
        if: needs.build.outputs.skipped-issues != ''
        env:
          SKIPPED: ${{ needs.build.outputs.skipped-issues }}
        run: |
          echo "::error title=Some Issues were not published::Issues $SKIPPED have errors; the build job summary says what to fix. Everything else is live."
          exit 1
